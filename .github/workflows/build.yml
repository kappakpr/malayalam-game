name: Build MalayalamGame

on:
  push:
    branches: [ main ]
    tags:
      - "macos-v*"
      - "windows-v*"
      - "linux-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            os_label: macos
            arch: arm64
            tag_prefix: macos-v
            artifact_name: MalayalamGame-macOS-arm64
            archive_name: MalayalamGame-macOS-arm64.zip
          - os: windows-latest
            os_label: windows
            arch: x64
            tag_prefix: windows-v
            artifact_name: MalayalamGame-Windows-x64
            archive_name: MalayalamGame-Windows-x64.zip
          - os: ubuntu-latest
            os_label: linux
            arch: x64
            tag_prefix: linux-v
            artifact_name: MalayalamGame-Linux-x64
            archive_name: MalayalamGame-Linux-x64.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies (macOS & Linux)
        if: runner.os != 'Windows'
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pyinstaller

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path "requirements.txt") { pip install -r requirements.txt }
          pip install pyinstaller

      - name: Build with PyInstaller (macOS)
        if: >-
          runner.os == 'macOS' &&
          (github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/tags/macos-v'))
        run: |
          pyinstaller --noconfirm --clean --windowed --name MalayalamGame \
            --add-data "assets:assets" \
            malayalam_game.py
          ls -la dist

      - name: Build with PyInstaller (Windows)
        if: >-
          runner.os == 'Windows' &&
          (github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/tags/windows-v'))
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --name MalayalamGame `
            --add-data "assets;assets" `
            malayalam_game.py

      - name: Build with PyInstaller (Linux)
        if: >-
          runner.os == 'Linux' &&
          (github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/tags/linux-v'))
        run: |
          pyinstaller --noconfirm --clean --windowed --name MalayalamGame \
            --add-data "assets:assets" \
            malayalam_game.py

      - name: Smoke test build (macOS)
        if: >-
          runner.os == 'macOS' &&
          (github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/tags/macos-v'))
        run: |
          APP_BIN="dist/MalayalamGame.app/Contents/MacOS/MalayalamGame"
          if [ ! -f "$APP_BIN" ]; then
            echo "Expected binary not found at $APP_BIN"
            exit 1
          fi

          QT_QPA_PLATFORM=offscreen "$APP_BIN" &
          APP_PID=$!
          sleep 3
          if ! kill -0 "$APP_PID" 2>/dev/null; then
            echo "MalayalamGame.app exited unexpectedly during smoke test."
            exit 1
          fi
          kill "$APP_PID" 2>/dev/null || true

      - name: Package macOS archive
        if: >-
          runner.os == 'macOS' &&
          (github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/tags/macos-v'))
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/MalayalamGame.app "${{ matrix.archive_name }}"
          ls -lh "${{ matrix.archive_name }}"

      - name: Smoke test build (Windows)
        if: >-
          runner.os == 'Windows' &&
          (github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/tags/windows-v'))
        shell: pwsh
        run: |
          $exePath = "dist\MalayalamGame\MalayalamGame.exe"
          if (-not (Test-Path $exePath)) {
            Write-Error "Executable not found at $exePath"
            exit 1
          }

          $proc = Start-Process -FilePath $exePath -PassThru
          Start-Sleep -Seconds 3
          $proc.Refresh()

          if ($proc.HasExited) {
            Write-Error "MalayalamGame.exe exited immediately with code $($proc.ExitCode)"
            exit 1
          }

          Stop-Process -Id $proc.Id -Force

      - name: Package Windows archive
        if: >-
          runner.os == 'Windows' &&
          (github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/tags/windows-v'))
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\MalayalamGame\*" -DestinationPath "${{ matrix.archive_name }}" -Force
          Get-Item "${{ matrix.archive_name }}"

      - name: Smoke test build (Linux)
        if: >-
          runner.os == 'Linux' &&
          (github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/tags/linux-v'))
        run: |
          sudo apt-get update && sudo apt-get install -y \
            xvfb \
            libegl1 \
            libgl1 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xkb1 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libfontconfig1 \
            libfreetype6 \
            libdbus-1-3 \
            libpulse0
          xvfb-run -a ./dist/MalayalamGame/MalayalamGame &
          APP_PID=$!
          sleep 3
          if ! kill -0 "$APP_PID" 2>/dev/null; then
            echo "MalayalamGame exited unexpectedly during smoke test."
            exit 1
          fi
          kill "$APP_PID" 2>/dev/null || true

      - name: Package Linux archive
        if: >-
          runner.os == 'Linux' &&
          (github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/tags/linux-v'))
        run: |
          tar -czvf "${{ matrix.archive_name }}" -C dist MalayalamGame
          ls -lh "${{ matrix.archive_name }}"

      - name: Upload build artifact
        if: >-
          github.event_name != 'push' ||
          !startsWith(github.ref, 'refs/tags/') ||
          (matrix.os_label == 'macos' && startsWith(github.ref, 'refs/tags/macos-v')) ||
          (matrix.os_label == 'windows' && startsWith(github.ref, 'refs/tags/windows-v')) ||
          (matrix.os_label == 'linux' && startsWith(github.ref, 'refs/tags/linux-v'))
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.archive_name }}
          if-no-files-found: error

  publish:
    if: >-
      github.event_name == 'push' &&
      (
        startsWith(github.ref, 'refs/tags/macos-v') ||
        startsWith(github.ref, 'refs/tags/windows-v') ||
        startsWith(github.ref, 'refs/tags/linux-v')
      )
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            os_label: macos
            arch: arm64
            tag_prefix: macos-v
            artifact_name: MalayalamGame-macOS-arm64
            archive_name: MalayalamGame-macOS-arm64.zip
          - os: windows-latest
            os_label: windows
            arch: x64
            tag_prefix: windows-v
            artifact_name: MalayalamGame-Windows-x64
            archive_name: MalayalamGame-Windows-x64.zip
          - os: ubuntu-latest
            os_label: linux
            arch: x64
            tag_prefix: linux-v
            artifact_name: MalayalamGame-Linux-x64
            archive_name: MalayalamGame-Linux-x64.tar.gz
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download OS build artifact
        if: >-
          (matrix.os_label == 'macos' && startsWith(github.ref, 'refs/tags/macos-v')) ||
          (matrix.os_label == 'windows' && startsWith(github.ref, 'refs/tags/windows-v')) ||
          (matrix.os_label == 'linux' && startsWith(github.ref, 'refs/tags/linux-v'))
        uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: release-assets

      - name: Generate SHA256SUMS.txt and release.json
        if: >-
          (matrix.os_label == 'macos' && startsWith(github.ref, 'refs/tags/macos-v')) ||
          (matrix.os_label == 'windows' && startsWith(github.ref, 'refs/tags/windows-v')) ||
          (matrix.os_label == 'linux' && startsWith(github.ref, 'refs/tags/linux-v'))
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          OS_LABEL: ${{ matrix.os_label }}
          ARCH_LABEL: ${{ matrix.arch }}
          ARCHIVE_NAME: ${{ matrix.archive_name }}
        run: |
          python3 - <<'EOF'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          assets_dir = Path("release-assets")
          archive_path = assets_dir / os.environ["ARCHIVE_NAME"]
          if not archive_path.is_file():
              raise SystemExit(f"Expected archive not found: {archive_path}")

          digest = hashlib.sha256(archive_path.read_bytes()).hexdigest()
          (assets_dir / "SHA256SUMS.txt").write_text(
              f"{digest}  {archive_path.name}\n", encoding="utf-8"
          )

          manifest = {
              "tag": os.environ["RELEASE_TAG"],
              "published_at": datetime.now(timezone.utc).isoformat(),
              "assets": [
                  {
                      "os": os.environ["OS_LABEL"],
                      "arch": os.environ["ARCH_LABEL"],
                      "filename": archive_path.name,
                      "size_bytes": archive_path.stat().st_size,
                      "sha256": digest,
                  }
              ],
          }
          (assets_dir / "release.json").write_text(
              json.dumps(manifest, indent=2) + "\n", encoding="utf-8"
          )
          EOF
          cat release-assets/SHA256SUMS.txt
          cat release-assets/release.json

publish:
    needs: build
    if: >-
      always() &&
      github.event_name == 'push' &&
      (
        startsWith(github.ref, 'refs/tags/macos-v') ||
        startsWith(github.ref, 'refs/tags/windows-v') ||
        startsWith(github.ref, 'refs/tags/linux-v')
      )
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            os_label: macos
            arch: arm64
            tag_prefix: macos-v
            artifact_name: MalayalamGame-macOS-arm64
            archive_name: MalayalamGame-macOS-arm64.zip
          - os: windows-latest
            os_label: windows
            arch: x64
            tag_prefix: windows-v
            artifact_name: MalayalamGame-Windows-x64
            archive_name: MalayalamGame-Windows-x64.zip
          - os: ubuntu-latest
            os_label: linux
            arch: x64
            tag_prefix: linux-v
            artifact_name: MalayalamGame-Linux-x64
            archive_name: MalayalamGame-Linux-x64.tar.gz
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download OS build artifact
        id: download_artifact
        continue-on-error: true
        if: >-
          (matrix.os_label == 'macos' && startsWith(github.ref, 'refs/tags/macos-v')) ||
          (matrix.os_label == 'windows' && startsWith(github.ref, 'refs/tags/windows-v')) ||
          (matrix.os_label == 'linux' && startsWith(github.ref, 'refs/tags/linux-v'))
        uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: release-assets

      - name: Generate SHA256SUMS.txt and release.json
        id: generate_manifest
        if: >-
          steps.download_artifact.outcome == 'success' &&
          (
            (matrix.os_label == 'macos' && startsWith(github.ref, 'refs/tags/macos-v')) ||
            (matrix.os_label == 'windows' && startsWith(github.ref, 'refs/tags/windows-v')) ||
            (matrix.os_label == 'linux' && startsWith(github.ref, 'refs/tags/linux-v'))
          )
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          OS_LABEL: ${{ matrix.os_label }}
          ARCH_LABEL: ${{ matrix.arch }}
          ARCHIVE_NAME: ${{ matrix.archive_name }}
        run: |
          python3 - <<'EOF'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          assets_dir = Path("release-assets")
          archive_path = assets_dir / os.environ["ARCHIVE_NAME"]
          if not archive_path.is_file():
              raise SystemExit(f"Expected archive not found: {archive_path}")

          digest = hashlib.sha256(archive_path.read_bytes()).hexdigest()
          (assets_dir / "SHA256SUMS.txt").write_text(
              f"{digest}  {archive_path.name}\n", encoding="utf-8"
          )

          manifest = {
              "tag": os.environ["RELEASE_TAG"],
              "published_at": datetime.now(timezone.utc).isoformat(),
              "assets": [
                  {
                      "os": os.environ["OS_LABEL"],
                      "arch": os.environ["ARCH_LABEL"],
                      "filename": archive_path.name,
                      "size_bytes": archive_path.stat().st_size,
                      "sha256": digest,
                  }
              ],
          }
          (assets_dir / "release.json").write_text(
              json.dumps(manifest, indent=2) + "\n", encoding="utf-8"
          )
          EOF
          cat release-assets/SHA256SUMS.txt
          cat release-assets/release.json

      - name: Publish GitHub Release
        if: >-
          steps.generate_manifest.outcome == 'success' &&
          (
            (matrix.os_label == 'macos' && startsWith(github.ref, 'refs/tags/macos-v')) ||
            (matrix.os_label == 'windows' && startsWith(github.ref, 'refs/tags/windows-v')) ||
            (matrix.os_label == 'linux' && startsWith(github.ref, 'refs/tags/linux-v'))
          )
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          files: |
            release-assets/${{ matrix.archive_name }}
            release-assets/SHA256SUMS.txt
            release-assets/release.json
          generate_release_notes: true
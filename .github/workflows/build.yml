name: Build MalayalamGame

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: MalayalamGame-macOS
            artifact_path: dist/MalayalamGame.app
          - os: windows-latest
            artifact_name: MalayalamGame-Windows
            artifact_path: dist/MalayalamGame
          - os: ubuntu-latest
            artifact_name: MalayalamGame-Linux
            artifact_path: dist/MalayalamGame

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies (macOS & Linux)
        if: runner.os != 'Windows'
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pyinstaller

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path "requirements.txt") { pip install -r requirements.txt }
          pip install pyinstaller

      - name: Build with PyInstaller (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --clean --windowed --name MalayalamGame malayalam_game.py

      - name: Build with PyInstaller (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --name MalayalamGame malayalam_game.py

      - name: Build with PyInstaller (Linux)
        if: runner.os == 'Linux'
        run: |
          pyinstaller --noconfirm --clean --windowed --name MalayalamGame malayalam_game.py

      - name: Print executable file name (macOS)
        if: runner.os == 'macOS'
        run: |
          ls -la dist/
          ls -1 dist/MalayalamGame.app/Contents/MacOS

      - name: Print executable file name (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem -Path "dist" -Recurse -File -Include "*.exe" | Select-Object -ExpandProperty FullName

      - name: Print executable file name (Linux)
        if: runner.os == 'Linux'
        run: |
          ls -la dist/
          ls -1 dist/MalayalamGame

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
name: Build MalayalamGame

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform_tag: macOS
            sep: ":"
            extra_flags: --windowed
          - os: windows-latest
            platform_tag: Windows
            sep: ";"
            extra_flags: --windowed --onefile
          - os: ubuntu-latest
            platform_tag: Linux
            sep: ":"
            extra_flags: --onefile

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build executable with PyInstaller
        shell: bash
        run: |
          pyinstaller --noconfirm --clean --name "MalayalamGame" \
            ${{ matrix.extra_flags }} \
            --add-data "assets${{ matrix.sep }}assets" \
            --collect-all edge_tts \
            malayalam_game.py

      - name: Package build output as zip
        shell: bash
        run: |
          mkdir -p release_assets
          if [ "${{ runner.os }}" = "macOS" ]; then
            ditto -c -k --sequesterRsrc --keepParent "dist/MalayalamGame.app" "release_assets/MalayalamGame-macOS.zip"
          elif [ "${{ runner.os }}" = "Windows" ]; then
            powershell -Command "Compress-Archive -Path 'dist\MalayalamGame.exe' -DestinationPath 'release_assets\MalayalamGame-Windows.zip' -Force"
          else
            tar -czf "release_assets/MalayalamGame-Linux.tar.gz" -C dist MalayalamGame
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MalayalamGame-${{ matrix.platform_tag }}
          path: release_assets/*

      - name: Publish to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
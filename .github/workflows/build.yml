name: Build MalayalamGame

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: MalayalamGame-macOS
            archive_name: MalayalamGame-macOS.zip
          - os: windows-latest
            artifact_name: MalayalamGame-Windows
            archive_name: MalayalamGame-Windows.zip
          - os: ubuntu-latest
            artifact_name: MalayalamGame-Linux
            archive_name: MalayalamGame-Linux.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies (macOS & Linux)
        if: runner.os != 'Windows'
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pyinstaller

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path "requirements.txt") { pip install -r requirements.txt }
          pip install pyinstaller

      - name: Build with PyInstaller (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --clean --windowed --name MalayalamGame \
            --add-data "assets:assets" \
            malayalam_game.py
          ls -la dist

      - name: Build with PyInstaller (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --name MalayalamGame `
            --add-data "assets;assets" `
            malayalam_game.py

      - name: Build with PyInstaller (Linux)
        if: runner.os == 'Linux'
        run: |
          pyinstaller --noconfirm --clean --windowed --name MalayalamGame \
            --add-data "assets:assets" \
            malayalam_game.py

      - name: Smoke test build (macOS)
        if: runner.os == 'macOS'
        run: |
          APP_BIN="dist/MalayalamGame.app/Contents/MacOS/MalayalamGame"
          if [ ! -f "$APP_BIN" ]; then
            echo "Expected binary not found at $APP_BIN"
            exit 1
          fi

          QT_QPA_PLATFORM=offscreen "$APP_BIN" &
          APP_PID=$!
          sleep 3
          if ! kill -0 "$APP_PID" 2>/dev/null; then
            echo "MalayalamGame.app exited unexpectedly during smoke test."
            exit 1
          fi
          kill "$APP_PID" 2>/dev/null || true

      - name: Package macOS archive
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/MalayalamGame.app "${{ matrix.archive_name }}"
          ls -lh "${{ matrix.archive_name }}"

      - name: Smoke test build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exePath = "dist\MalayalamGame\MalayalamGame.exe"
          if (-not (Test-Path $exePath)) {
            Write-Error "Executable not found at $exePath"
            exit 1
          }

          $proc = Start-Process -FilePath $exePath -PassThru
          Start-Sleep -Seconds 3
          $proc.Refresh()

          if ($proc.HasExited) {
            Write-Error "MalayalamGame.exe exited immediately with code $($proc.ExitCode)"
            exit 1
          }

          Stop-Process -Id $proc.Id -Force

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\MalayalamGame\*" -DestinationPath "${{ matrix.archive_name }}" -Force
          Get-Item "${{ matrix.archive_name }}"

      - name: Smoke test build (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y \
            xvfb \
            libegl1 \
            libgl1 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xkb1 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libfontconfig1 \
            libfreetype6 \
            libdbus-1-3 \
            libpulse0
          xvfb-run -a ./dist/MalayalamGame/MalayalamGame &
          APP_PID=$!
          sleep 3
          if ! kill -0 "$APP_PID" 2>/dev/null; then
            echo "MalayalamGame exited unexpectedly during smoke test."
            exit 1
          fi
          kill "$APP_PID" 2>/dev/null || true

      - name: Package Linux archive
        if: runner.os == 'Linux'
        run: |
          tar -czvf "${{ matrix.archive_name }}" -C dist MalayalamGame
          ls -lh "${{ matrix.archive_name }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.archive_name }}
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-assets/**/*
          generate_release_notes: true
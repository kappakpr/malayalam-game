name: Build MalayalamGame

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: MalayalamGame-macOS
            artifact_path: dist/MalayalamGame.app
          - os: windows-latest
            artifact_name: MalayalamGame-Windows
            artifact_path: dist/MalayalamGame
          - os: ubuntu-latest
            artifact_name: MalayalamGame-Linux
            artifact_path: dist/MalayalamGame

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pyinstaller

      - name: Build with PyInstaller (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --clean --windowed --name MalayalamGame main.py

      - name: Build with PyInstaller (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --name MalayalamGame main.py

      - name: Build with PyInstaller (Linux)
        if: runner.os == 'Linux'
        run: |
          pyinstaller --noconfirm --clean --windowed --name MalayalamGame main.py

      - name: Smoke test build (macOS)
        if: runner.os == 'macOS'
        run: |
          open -a dist/MalayalamGame.app
          sleep 3
          if ! pgrep -f "MalayalamGame" > /dev/null; then
            echo "MalayalamGame.app exited unexpectedly during smoke test."
            exit 1
          fi
          pkill -f "MalayalamGame" || true

      - name: Smoke test build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exePath = "dist\MalayalamGame\MalayalamGame.exe"
          if (-not (Test-Path $exePath)) {
            $exePath = "dist\MalayalamGame.exe"
          }

          $proc = Start-Process -FilePath $exePath -PassThru
          Start-Sleep -Seconds 3
          $proc.Refresh()

          if ($proc.HasExited) {
            Write-Error "MalayalamGame.exe exited immediately with code $($proc.ExitCode)"
            exit 1
          }

          Stop-Process -Id $proc.Id -Force

      - name: Smoke test build (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          xvfb-run -a ./dist/MalayalamGame/MalayalamGame &
          APP_PID=$!
          sleep 3
          if ! kill -0 "$APP_PID" 2>/dev/null; then
            echo "MalayalamGame exited unexpectedly during smoke test."
            exit 1
          fi
          kill "$APP_PID" 2>/dev/null || true

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error